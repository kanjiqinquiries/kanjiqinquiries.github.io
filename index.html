<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KanjiQ – Learn Kanji by Picture</title>
<meta name="description" content="Picture quizzes for Japanese kanji and vocabulary, JLPT N5 to N1. Available on the App Store.">
<meta property="og:title" content="KanjiQ – Learn Kanji by Picture">
<meta property="og:description" content="Picture quizzes for Japanese kanji and vocabulary, JLPT N5 to N1.">
<meta name="apple-itunes-app" content="app-id=6813856100">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F1E6;
    --red: #E24B4A;
    --ink: #262626;
    --muted: #6b6359;
    --card: #fffaf0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: max(40px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
  }
  main {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .icon {
    width: 112px;
    height: 112px;
    border-radius: 26px;
    box-shadow: 0 18px 40px rgba(60, 40, 20, 0.22);
  }
  .name {
    margin-top: 18px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin-top: 14px;
    font-family: "Playfair Display", Georgia, serif;
    font-size: 40px;
    line-height: 1.12;
    font-weight: 700;
  }
  h1 em { color: var(--red); font-style: italic; }
  .lead {
    margin-top: 16px;
    font-size: 17px;
    line-height: 1.5;
    color: var(--muted);
  }
  .cta {
    margin-top: 28px;
    display: block;
    width: 100%;
    padding: 18px 24px;
    border-radius: 999px;
    background: var(--red);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 12px 28px rgba(226, 75, 74, 0.35);
  }
  .cta:active { transform: scale(0.98); }
  .fallback {
    margin-top: 14px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--muted);
  }
  .fallback b { color: var(--ink); }
  .stats {
    margin-top: 32px;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat {
    background: var(--card);
    border-radius: 18px;
    padding: 16px 6px;
    box-shadow: 0 8px 22px rgba(60, 40, 20, 0.10);
  }
  .stat strong {
    display: block;
    font-family: "Playfair Display", Georgia, serif;
    font-size: 22px;
    color: var(--ink);
  }
  .stat span {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    line-height: 1.3;
    color: var(--muted);
  }
  footer {
    margin-top: 36px;
    font-size: 13px;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="KanjiQ app icon" width="112" height="112">
  <div class="name">KanjiQ</div>
  <h1>Learn Japanese <em>kanji</em> by picture</h1>
  <p class="lead">Picture quizzes for kanji and vocabulary, JLPT N5 to N1. No complicated systems.</p>

  <a class="cta" href="https://apps.apple.com/app/id6813856100">Get it on the App Store</a>
  <p class="fallback">Button not opening? Search <b>KanjiQ</b> in the App Store.</p>

  <div class="stats">
    <div class="stat"><strong>3,707</strong><span>Kanji &amp; words</span></div>
    <div class="stat"><strong>1,829</strong><span>Illustrations</span></div>
    <div class="stat"><strong>Offline</strong><span>No internet needed</span></div>
  </div>

  <footer><a href="https://kanjiqinquiries.github.io/kanjiquiz-privacy/">Privacy Policy</a></footer>
</main>
</body>
</html>
